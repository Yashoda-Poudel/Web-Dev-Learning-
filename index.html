<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 200px;
            height: 100px;
            margin: 10px;
            padding: 10px;
            border: 1px solid black;
            display:inline-block;

        }

        .box1 {
            background-color: lightblue;
            color: white;
            
        }

        .box2 {
            background-color: lightgreen;
            
        }

        .box3 {
            background-color: lightcoral;
        }

        .box4 {
            background-color: lightgoldenrodyellow;
        }
    </style>
</head>
<body>
    <div class="Container">
        <h1>Document Object Model (DOM) in JavaScript</h1>  
    <div  id="box1" class="box box1"> I am a box
        <button id="btn1">Click me</button>
    </div>
    <div id="box2" class="box box2">
         I am also a box
        <button id="btn2">Click me</button>
        </div>
    <div  id="box3" class="box box3">
         I am yet another box
        <button id="btn3">Click me</button>
        </div>
    <div id="box4" class="box box4">
         I am the last box
        <button id="btn4">Click me</button>
        </div>
     
    </div>  



    
<script>
document.title="Learning document Object Model"
console.log (document.title)
console.log(document.body)
document.body.style.backgroundColor="lightblue";</script>
   
<script src="script.js"></script>
</body>
</html>
