<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            width: 200px;
            height: 100px;
            margin: 10px;
            padding: 10px;
           background-color: lightcoral;
            
        }

        .childcontainer {
            width: 150px;
            height: 50px;
            margin: 10px;
            padding: 10px;
            background-color: lightgreen;
        }

        .child {
            width: 100px;
            background-color: lightblue;
            height: 30px;
            margin: 10px;
            padding: 10px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="childcontainer">
            <div class="child">I am a box</div>
        </span>
    </div>

    <script>
        document.querySelector(".child").addEventListener("click", (e) => {
            e.stopPropagation();
            alert("You clicked on the child.");
        });

        document.querySelector(".childcontainer").addEventListener("click", (e  ) => {
            e.stopPropagation();
            alert("You clicked on the child container.");
        });

        document.querySelector(".container").addEventListener("click", (e) => {
            e.stopPropagation();
            alert("You clicked on the container.");
        });

        setInterval(() => {
            document.querySelector(".container").style.backgroundColor = "red";
        }, 3000);

setTimeout(() => {
            document.querySelector(".container").style.backgroundColor = "lightcoral";
        }, 6000);
       

    </script>
</body>
</html>
